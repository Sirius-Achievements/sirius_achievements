map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name emercom.online www.emercom.online jenkins.emercom.online;
    return 301 https://$host$request_uri;
}

# emercom.online no longer hosts the SA app (moved to sirius-achievements.ru),
# brpedia (wiki.ixyo.ru) or the epoch dashboard (epoch.ixyo.ru). Redirect only.
server {
    listen 443 ssl;
    http2 on;
    server_name emercom.online www.emercom.online;

    ssl_certificate /etc/letsencrypt/live/emercom.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emercom.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES:!RC4;
    ssl_prefer_server_ciphers on;

    location = /brpedia    { return 301 https://wiki.ixyo.ru/; }
    location /brpedia/     { return 301 https://wiki.ixyo.ru/; }

    location /m-185383cf3e/ { return 301 https://epoch.ixyo.ru/console; }

    location / { return 301 https://sirius-achievements.ru$request_uri; }
}

# jenkins.emercom.online -> jenkins.sirius-achievements.ru
server {
    listen 443 ssl;
    http2 on;
    server_name jenkins.emercom.online;

    ssl_certificate /etc/letsencrypt/live/emercom.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emercom.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / { return 301 https://jenkins.sirius-achievements.ru$request_uri; }
}

# Dedicated subdomains (persistent, rsync-excluded — CI deploys never wipe them).
# Full server blocks live in wm-extra/domains.conf; included at http level here.
include /etc/nginx/conf.d/wm-extra/domains.conf;
