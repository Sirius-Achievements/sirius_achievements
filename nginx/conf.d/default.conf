map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name emercom.online www.emercom.online jenkins.emercom.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name emercom.online www.emercom.online;

    ssl_certificate /etc/letsencrypt/live/emercom.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emercom.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 12m;

    # Compress text responses on the fly (JS/CSS/JSON/SVG). woff2 is already
    # compressed, so it is intentionally left out. Brotli is preferred by
    # browsers that support it; gzip is the fallback. Brotli requires the
    # nginx image to ship ngx_brotli (see docker-compose.vps.yml: fholzer/nginx-brotli).
    brotli on;
    brotli_comp_level 5;
    brotli_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Content-hashed SPA bundles (index-<hash>.js, chart-<hash>.js, *.css) never
    # change under a given name, so cache them for a year. A new build ships new
    # filenames, so there is nothing to bust.
    location /static/spa/assets/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /ws/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # Out-of-repo extras (dashboard + brpedia locations). Kept on a persistent,
    # rsync-excluded path so a deploy can't wipe them. Listed explicitly (not a
    # glob) because wm-extra/domains.conf holds http-level server blocks.
    include /etc/nginx/conf.d/wm-extra/dashboard.conf;
    include /etc/nginx/conf.d/wm-extra/sa.conf;

    location / {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name jenkins.emercom.online;

    ssl_certificate /etc/letsencrypt/live/emercom.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emercom.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass         http://jenkins:8080;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_redirect     http://jenkins:8080 https://jenkins.emercom.online;

        proxy_read_timeout    600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout    600s;

        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
    }
}

# Dedicated subdomains (persistent, rsync-excluded — CI deploys never wipe them).
# Full server blocks live in wm-extra/domains.conf; included at http level here.
include /etc/nginx/conf.d/wm-extra/domains.conf;
