services:
  db:
    image: postgres:15-alpine
    container_name: sirius_db_new
    restart: always
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      TZ: Europe/Moscow
    volumes:
      - postgres_data_new:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sirius_redis_new
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: sirius_app_new
    restart: always
    ports:
      - "8081:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_USERNAME=${DB_USERNAME:?DB_USERNAME is required}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - DB_NAME=${DB_NAME:?DB_NAME is required}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      - LOCAL_LLM_BASE_URL=http://vllm:8000/v1
      - TZ=Europe/Moscow
    volumes:
      - uploads_data:/app/static/uploads
      - ./models:/app/easyocr_models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Локальный сервер инференса для AI-сводки (Qwen2.5-3B-Instruct-AWQ).
  # Требует NVIDIA GPU + установленный nvidia-container-toolkit на хосте.
  # Не запускается при обычном "docker compose up" — только с флагом
  # --profile ai (см. RESUME_LOCAL_AI_ENABLED в .env).
  # Для локальной разработки на слабом GPU переопределите модель через
  # docker-compose.override.yml (не коммитится в git).
  
  vllm:
    image: vllm/vllm-openai:latest
    container_name: sirius_vllm_new
    restart: always
    profiles: ["ai"]
    command:
      - "--model=Qwen/Qwen2.5-3B-Instruct-AWQ"
      - "--quantization=awq"
      - "--max-model-len=8192"
      - "--gpu-memory-utilization=0.90"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - vllm_hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

volumes:
  postgres_data_new:
  uploads_data:
  vllm_hf_cache:
